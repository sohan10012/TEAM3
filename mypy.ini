[mypy]
python_version = 3.11
ignore_missing_imports = True
check_untyped_defs = False
warn_unused_ignores = False
strict_optional = False
plugins = pydantic.mypy
disable_error_code = var-annotated, import-untyped
exclude = (?x)(
    ^migrations/
    | ^backend/migrations/
    | ^backend/tests/
    | ^tests/
  )
