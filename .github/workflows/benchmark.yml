name: Live AI Benchmark (Manual)

on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'AI Provider to benchmark (groq | gemini | all)'
        required: true
        default: 'groq'
      iterations:
        description: 'Number of benchmark iterations'
        required: true
        default: '3'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Run Live AI Evaluation Benchmark
        env:
          TRACETEST_LLM_MODE: live
          TRACETEST_ALLOW_WEAK_SANDBOX: "1"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY2: ${{ secrets.GROQ_API_KEY2 }}
          GROQ_API_KEY3: ${{ secrets.GROQ_API_KEY3 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
          GEMINI_API_KEY3: ${{ secrets.GEMINI_API_KEY3 }}
        run: |
          python backend/evals/run_ai_eval.py --provider ${{ github.event.inputs.provider }} --iterations ${{ github.event.inputs.iterations }}
      - uses: actions/upload-artifact@v4
        with:
          name: ai-eval-benchmark
          path: docs/ai_eval_benchmark.json
