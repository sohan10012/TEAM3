name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      TRACETEST_LLM_MODE: mock
      TRACETEST_ALLOW_WEAK_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Dependency vulnerability check
        run: pip-audit -r backend/requirements.txt
      - name: Lint
        run: cd backend && ruff check app tests
      - name: Type check
        run: cd backend && mypy app
      - name: OpenAPI contract
        run: python scripts/export_openapi.py && git diff --exit-code docs/openapi.json
      - name: Tests (MockProvider fixtures, real sandbox)
        run: cd backend && pytest -q --cov=app --cov-report=term --junitxml=../artifacts/backend-junit.xml
      - name: Verify Documentation & Invariants
        run: python scripts/verify_docs.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-junit
          path: artifacts/backend-junit.xml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - name: Dependency audit
        run: cd frontend && npm audit --audit-level=critical
      - run: cd frontend && npm run gen:api && git diff --exit-code src/types/api.gen.ts
      - run: cd frontend && npm run lint
      - run: cd frontend && npm run typecheck
      - run: cd frontend && npm test
      - run: cd frontend && npm run build

  reference-hcm-regression:
    needs: backend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        hcm_version: ["1.0", "1.1"]
    env:
      TRACETEST_DATA_DIR: ${{ github.workspace }}/var
      TRACETEST_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Initialise workspace and export approved tests
        run: |
          python scripts/db.py init > /dev/null
          python scripts/export_tests.py ci-tests --project PAY
          cp -r reference_hcm ci-tests/
      - name: Run approved tests against Reference HCM ${{ matrix.hcm_version }}
        env:
          REFERENCE_HCM_VERSION: ${{ matrix.hcm_version }}
        run: cd ci-tests && python -m pytest -q --junitxml=../artifacts/hcm-${{ matrix.hcm_version }}.xml || true
      - name: Report results to TraceTest (when configured)
        env:
          TRACETEST_URL: ${{ secrets.TRACETEST_URL }}
          TRACETEST_CI_TOKEN: ${{ secrets.TRACETEST_CI_TOKEN }}
        run: python scripts/ci_report.py artifacts/hcm-${{ matrix.hcm_version }}.xml PAY ${{ matrix.hcm_version }}
      - uses: actions/upload-artifact@v4
        with:
          name: hcm-${{ matrix.hcm_version }}-junit
          path: artifacts/hcm-${{ matrix.hcm_version }}.xml

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      TRACETEST_LLM_MODE: mock
      TRACETEST_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          pip install -r backend/requirements-dev.txt
          playwright install --with-deps chromium
          cd frontend && npm ci && npm run build
      - name: Run Playwright E2E & Accessibility Tests
        run: |
          PYTHONPATH=backend pytest backend/tests/test_playwright_e2e.py -v --junitxml=artifacts/e2e-junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-junit
          path: artifacts/e2e-junit.xml
